upstream discovery-ai-backend {
    server discovery-ai-backend:3000;
}

server {
    listen 8081;

    client_max_body_size 10M;

    # Docker internal DNS — allows resolving hosts that may not be running
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /ws {
        proxy_pass http://discovery-ai-backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /comfyui/ {
        set $comfyui http://discovery-ai-comfyui:8188;
        rewrite ^/comfyui/(.*)$ /$1 break;
        proxy_pass $comfyui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://discovery-ai-backend/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

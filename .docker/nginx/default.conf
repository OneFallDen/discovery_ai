upstream discovery-ai-backend {
    server discovery-ai-backend:3000;
}

upstream discovery-ai-frontend {
    server discovery-ai-frontend:5173;
}

upstream discovery-ai-comfyui {
    server discovery-ai-comfyui:8188;
}

server {
    listen 8081;

    client_max_body_size 10M;

    # WebSocket для вашего приложения
    location /ws {
        proxy_pass http://discovery-ai-backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /comfyui/ {
        proxy_pass http://discovery-ai-comfyui/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # HTTP API бэкенда
    location /api/ {
        proxy_pass http://discovery-ai-backend/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite фронтенд (включая HMR WebSocket)
    location / {
        proxy_pass http://discovery-ai-frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
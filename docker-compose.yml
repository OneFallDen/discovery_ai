services:
  discovery-ai-nginx:
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
      args:
        VITE_COMFYUI_IMAGE_URL: ${VITE_COMFYUI_IMAGE_URL}
    ports:
      - ${PROXY_PORT:-8081}:8081
    depends_on:
      - discovery-ai-backend
    networks:
      - discovery-ai-network

  discovery-ai-backend:
    container_name: discovery-ai-backend
    build:
      context: .
      dockerfile: .docker/backend/Dockerfile
    ports:
      - ${BACKEND_PORT:-3000}:3000
    env_file:
      - .env
    depends_on:
      - discovery-ai-postgres
      - discovery-ai-redis
    networks:
      - discovery-ai-network

  discovery-ai-postgres:
    container_name: discovery-ai-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - discovery-ai-network

  discovery-ai-redis:
    container_name: discovery-ai-redis
    build:
      context: .docker/redis
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - discovery-ai-network

  discovery-ai-comfyui:
    container_name: discovery-ai-comfyui
    image: ghcr.io/clsferguson/comfyui-docker:latest
    ports:
      - ${COMFYUI_PORT:-8188}:8188
    volumes:
      - ./comfyui/workspace:/workspace:rshared
    environment:
      - CLI_ARGS=--listen 0.0.0.0
      - COMFY_AUTO_INSTALL=1
      - PUID=0
      - PGID=0
    entrypoint: ""
    command: >
      python /workspace/ComfyUI/main.py --listen 0.0.0.0 --port 8188
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    networks:
      - discovery-ai-network

networks:
  discovery-ai-network:

volumes:
  pgdata:
  redisdata:
